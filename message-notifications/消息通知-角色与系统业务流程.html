<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>消息通知 · 角色与系统流程</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;font-family:PingFang SC,Microsoft YaHei,sans-serif;color:#20324a}header{background:#fff;border-bottom:1px solid #dbe3ed;padding:18px 24px;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0 0 14px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,a{font:inherit;font-size:13px;padding:8px 13px;border:1px solid #d4dce8;background:#fff;border-radius:7px;cursor:pointer;text-decoration:none;color:#40536d}button.active{background:#225bd6;color:#fff;border-color:#225bd6}.spacer{flex:1}.sheet{padding:22px;overflow:auto}.drawing{display:block;max-width:none;background:white;box-shadow:0 5px 24px #1424440a}p{font-size:12px;color:#758296;margin:12px 0 0}</style><header><h1>消息通知 · 角色与系统泳道</h1><div class="bar"><button data-page="audience">圈选建包</button><button data-page="reach">引用人群包后多渠道触达</button><button data-page="automation">自动化任务注册与启停</button><span class="spacer"></span><button id="fit">适合宽度</button><button id="actual">原始大小</button><a href="消息通知-角色与系统业务流程.drawio" download>下载可编辑draw.io源图</a></div><p>角色与系统横向分列，流程从上向下推进；左侧标注阶段。可切换流程、缩放及下载源图。</p></header><main class="sheet"><img class="drawing" id="diagram" alt="角色与系统泳道流程图"></main><script>let current="audience",fit=true;function render(){const img=document.getElementById("diagram");img.src="角色与系统-"+current+".svg";img.style.width=fit?"100%":"auto";document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===current))}document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{current=b.dataset.page;render()});document.getElementById("fit").onclick=()=>{fit=true;render()};document.getElementById("actual").onclick=()=>{fit=false;render()};render();</script></html>
