<path d="M1852 382 L1877 382 L1877 194 L1902 194" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1871.0" y="276.0" width="72" height="22" rx="3" fill="white"/>
<text x="1877.0" y="291.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">按结果处理</text>
<rect x="222" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="302.0" y="189.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">@有效人群包</text>
<text x="302.0" y="209.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">输入渠道与发送要求</text>
<rect x="432" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="512.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">检查执行模式与引用</text>
<text x="512.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">解析本条发送安排</text>
<rect x="642" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="722.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">返回触达配置卡</text>
<text x="722.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">等待点击，不自动弹窗</text>
<rect x="852" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="932.0" y="189.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">点击卡片，配置城市</text>
<text x="932.0" y="209.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">渠道、客服及独立内容</text>
<rect x="1062" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1142.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">校验配置并展示</text>
<text x="1142.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">任务信息确认卡</text>
<rect x="1272" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1352.0" y="179.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">核对内容、修改名称</text>
<text x="1352.0" y="199.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">发送安排用自然语言改</text>
<text x="1352.0" y="219.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">最终确认创建</text>
<rect x="1482" y="534" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1562.0" y="565.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">按渠道分别创建任务</text>
<text x="1562.0" y="585.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">返回各渠道创建结果</text>
<rect x="1692" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1772.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">展示成功、失败</text>
<text x="1772.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">或结果待确认</text>
<rect x="1902" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1982.0" y="189.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">失败仅重试该渠道</text>
<text x="1982.0" y="209.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">未知结果先核查</text>
<text x="24" y="694" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#718198">缺少引用、模式不符或配置无效时提示处理，不自动圈选、切换模式或提交。创建成功不等于发送完成，成功任务按安排执行。</text>
</svg>