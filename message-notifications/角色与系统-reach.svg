<text x="35" y="204.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">执行模式；明确引用与确认</text>
<rect x="20" y="288" width="2092" height="188" fill="#f8fafc" stroke="#dce3ed"/>
<rect x="20" y="288" width="174" height="188" fill="#eef2f7" stroke="#dce3ed"/>
<text x="35" y="370.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#20324a" font-weight="600">AI私域助手</text>
<text x="35" y="392.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">检查引用、配置与逐渠</text>
<text x="35" y="414.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">道反馈</text>
<rect x="20" y="476" width="2092" height="188" fill="#ffffff" stroke="#dce3ed"/>
<rect x="20" y="476" width="174" height="188" fill="#eef2f7" stroke="#dce3ed"/>
<text x="35" y="558.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#20324a" font-weight="600">推送系统</text>
<text x="35" y="580.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">单渠道任务创建与调度</text>
<path d="M382 194 L407 194 L407 382 L432 382" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M592 382 L617 382 L617 382 L642 382" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="587.0" y="320" width="60" height="22" rx="3" fill="white"/>
<text x="593.0" y="335" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">引用有效</text>
<path d="M802 382 L827 382 L827 194 L852 194" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
