<rect x="1451.0" y="370.0" width="60" height="22" rx="3" fill="white"/>
<text x="1457.0" y="385.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">最终确认</text>
<path d="M1642 570 L1667 570 L1667 382 L1692 382" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1661.0" y="464.0" width="60" height="22" rx="3" fill="white"/>
