<text x="1457.0" y="291.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">确认建包</text>
<path d="M1642 382 L1667 382 L1667 194 L1692 194" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="1661.0" y="276.0" width="60" height="22" rx="3" fill="white"/>
<text x="1667.0" y="291.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">另行发起</text>
<rect x="222" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="302.0" y="189.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">输入目标人群</text>
<text x="302.0" y="209.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">和圈选条件</text>
<rect x="432" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="512.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">识别C端 / 小B</text>
<text x="512.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">解析纳入、排除条件</text>
<rect x="642" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="722.0" y="189.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">确认解析条件</text>
<text x="722.0" y="209.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">或描述变更条件</text>
<rect x="852" y="534" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="932.0" y="555.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">查询对应来源</text>
<text x="932.0" y="575.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">小B：运营新报表</text>
<text x="932.0" y="595.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">C端：原有数据链路</text>
<rect x="1062" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1142.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">返回人数、样本</text>
<text x="1142.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">名称及更新频率</text>
<rect x="1272" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1352.0" y="189.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">核对人群预览</text>
<text x="1352.0" y="209.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">确认创建人群包</text>
<rect x="1482" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1562.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">创建并返回人群包</text>
<text x="1562.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">本次圈选结束</text>
<rect x="1692" y="158" width="160" height="72" rx="9" fill="#f0f8f4" stroke="#a6cbb5"/>
<text x="1772.0" y="179.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">如需触达，手动切换</text>
<text x="1772.0" y="199.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">执行模式，@人群包</text>
<text x="1772.0" y="219.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">另行输入触达要求</text>
<text x="24" y="694" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#718198">条件变更后重新确认；查询失败或0人不创建有效人群包。圈选指令中的发送安排不带入后续触达。</text>
</svg>