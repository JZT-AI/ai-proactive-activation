<text x="609.0" y="826.0" text-anchor="middle" font-size="14" fill="#374151">创建并返回人群包</text>
<text x="609.0" y="846.0" text-anchor="middle" font-size="14" fill="#374151">本次圈选结束</text>
<rect x="163.0" y="924.0" width="232" height="66" rx="5" fill="white" stroke="#596bb0" stroke-width="1"/>
<text x="279.0" y="942.0" text-anchor="middle" font-size="14" fill="#374151">如需触达，手动切换</text>
