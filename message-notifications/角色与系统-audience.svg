<text x="1037.0" y="479.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">查询结果</text>
<path d="M1222 382 L1247 382 L1247 194 L1272 194" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1432 194 L1457 194 L1457 382 L1482 382" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
