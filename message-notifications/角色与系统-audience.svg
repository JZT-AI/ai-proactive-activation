<rect x="493.0" y="546.0" width="232" height="66" rx="5" fill="white" stroke="#8870b5" stroke-width="1"/>
<text x="609.0" y="574.0" text-anchor="middle" font-size="14" fill="#374151">查询失败或0人</text>
