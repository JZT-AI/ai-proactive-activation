<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1114" viewBox="0 0 1130 1114" role="img" aria-label="圈选建包系统角色泳道图" style="font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif">
