<text x="35" y="204.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">圈选模式；确认条件与建包</text>
<rect x="20" y="288" width="1882" height="188" fill="#f8fafc" stroke="#dce3ed"/>
<rect x="20" y="288" width="174" height="188" fill="#eef2f7" stroke="#dce3ed"/>
<text x="35" y="370.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#20324a" font-weight="600">AI私域助手</text>
<text x="35" y="392.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">识别条件、预览与人群包</text>
<rect x="20" y="476" width="1882" height="188" fill="#ffffff" stroke="#dce3ed"/>
<rect x="20" y="476" width="174" height="188" fill="#eef2f7" stroke="#dce3ed"/>
<text x="35" y="558.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#20324a" font-weight="600">圈选查询服务</text>
<text x="35" y="580.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">按目标查询对应来源</text>
<path d="M382 194 L407 194 L407 382 L432 382" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M592 382 L617 382 L617 194 L642 194" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
