<svg xmlns="http://www.w3.org/2000/svg" width="1922" height="758" viewBox="0 0 1922 758" role="img" aria-label="自动化任务注册与启停角色与系统泳道图">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71849d"/></marker></defs>
<rect width="1922" height="758" fill="#ffffff"/>
<text x="24" y="36" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#20324a" font-weight="600">自动化任务注册与启停 · 角色与系统泳道</text>
<text x="24" y="65" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#718198">从左向右阅读；同一横道内为对应角色或系统负责的动作。</text>
<rect x="20" y="100" width="1882" height="188" fill="#ffffff" stroke="#dce3ed"/>
<rect x="20" y="100" width="174" height="188" fill="#eef2f7" stroke="#dce3ed"/>
<text x="35" y="182.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#20324a" font-weight="600">用户 / 当前城市管理员</text>
<text x="35" y="204.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">所有人可见；仅管理员启停</text>
<rect x="20" y="288" width="1882" height="188" fill="#f8fafc" stroke="#dce3ed"/>
<rect x="20" y="288" width="174" height="188" fill="#eef2f7" stroke="#dce3ed"/>
<text x="35" y="370.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#20324a" font-weight="600">AI私域助手</text>
<text x="35" y="392.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">任务列表、权限检查与</text>
<text x="35" y="414.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">请求反馈</text>
<rect x="20" y="476" width="1882" height="188" fill="#ffffff" stroke="#dce3ed"/>
<rect x="20" y="476" width="174" height="188" fill="#eef2f7" stroke="#dce3ed"/>
<text x="35" y="558.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#20324a" font-weight="600">原业务系统</text>
<text x="35" y="580.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">注册已有规则；维护触</text>
<text x="35" y="602.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#718198" font-weight="400">达开关</text>
<path d="M382 570 L407 570 L407 382 L432 382" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="401.0" y="464.0" width="60" height="22" rx="3" fill="white"/>
<text x="407.0" y="479.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">注册信息</text>
<path d="M592 382 L617 382 L617 194 L642 194" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="611.0" y="276.0" width="60" height="22" rx="3" fill="white"/>
<text x="617.0" y="291.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">任务列表</text>
<path d="M802 194 L827 194 L827 194 L852 194" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="791.0" y="132" width="72" height="22" rx="3" fill="white"/>
<text x="797.0" y="147" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">管理员操作</text>
<path d="M1012 194 L1037 194 L1037 382 L1062 382" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1031.0" y="276.0" width="60" height="22" rx="3" fill="white"/>
<text x="1037.0" y="291.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">确认操作</text>
<path d="M1222 382 L1247 382 L1247 570 L1272 570" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1241.0" y="464.0" width="60" height="22" rx="3" fill="white"/>
<text x="1247.0" y="479.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">启停请求</text>
<path d="M1432 570 L1457 570 L1457 382 L1482 382" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1451.0" y="464.0" width="60" height="22" rx="3" fill="white"/>
<text x="1457.0" y="479.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">实际结果</text>
<path d="M1642 382 L1667 382 L1667 570 L1692 570" fill="none" stroke="#71849d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1661.0" y="464.0" width="60" height="22" rx="3" fill="white"/>
<text x="1667.0" y="479.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#60728a">确认生效</text>
<rect x="222" y="534" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="302.0" y="565.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">注册已有规则</text>
<text x="302.0" y="585.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">提供名称、渠道与分类</text>
<rect x="432" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="512.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">读取当前城市</text>
<text x="512.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">已注册任务及实际状态</text>
<rect x="642" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="722.0" y="189.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">查看、搜索或筛选</text>
<text x="722.0" y="209.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">普通成员仅查看</text>
<rect x="852" y="158" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="932.0" y="189.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">管理员开启 / 关闭</text>
<text x="932.0" y="209.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">关闭时确认城市与任务</text>
<rect x="1062" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1142.0" y="377.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">校验当前权限及城市</text>
<text x="1142.0" y="397.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">请求原业务系统启停</text>
<rect x="1272" y="534" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1352.0" y="565.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">按当前城市应用开关</text>
<text x="1352.0" y="585.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">返回实际生效结果</text>
<rect x="1482" y="346" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1562.0" y="367.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">确认生效：更新状态</text>
<text x="1562.0" y="387.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">失败 / 未确认：提示</text>
<text x="1562.0" y="407.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">并核实实际状态</text>
<rect x="1692" y="534" width="160" height="72" rx="9" fill="#eef4ff" stroke="#a8bde8"/>
<text x="1772.0" y="555.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">开启：处理后续事件</text>
<text x="1772.0" y="575.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">关闭：停止该规则</text>
<text x="1772.0" y="595.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#24364c">在当前城市新增触达</text>
<text x="24" y="694" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#718198">普通成员无启停入口；业务系统未确认生效时不虚报状态。开关不影响其他城市和规则，重新开启不补发关闭期间消息。</text>
</svg>